# Publishes docs/index.html (a static, hand-written results page — no
# build step, no generator) to GitHub Pages. Manual only: run it from the
# Actions tab when you actually want to deploy. Not wired to push, since
# docs/screenshots gets pushed to often (every demo screenshot lands
# there) and none of that should trigger a Pages deploy.
#
# One-time manual step this workflow can't do for you: in the repo's
# Settings -> Pages, set "Source" to "GitHub Actions". Until that's set,
# a run will fail at the deploy step with a permissions error — that's
# expected, not a bug in the workflow.
name: Deploy results page to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
